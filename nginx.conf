server {
    listen 80;
    server_name localhost;

    # Root directory where Astro's build output lives
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        # Support for clean URLs and fallback to 404
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Custom 500-level pages
    # This covers 500, 502 (Bad Gateway), 503 (Service Unavailable), and 504 (Timeout)
    error_page 500 502 503 504 /500.html;
    location = /500.html {
        internal;
    }
}